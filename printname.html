!DOCTYPE <html>
<html lang="en">
    <head>
        <title>Array with a for loop</title>
    </head>
    <h1>Array with a for loop</h1>
    
    <h2>Create an array of 5 student names. use a for loop to print each name</h2>
    <body>
        <script>
            let students = ["Rahul", "Amit", "Neha", "Pooja", "Ravi"];
            for (let i = 0; i < students.length; i++){
                console.log(students[i]);
            }
        </script>
    </body>
</html>
