!DOCTYPE <html>
<html lang="en">
    <head>
        <title>Array</title>
        <h1>Array and if condition - Even Numbers</h1>
    </head>
    <body>
        <script>
            let numbers = [10, 15, 20, 25, 30];
            for (let i = 0; i < numbers.length; i++){
                if(numbers[i] % 2 == 0) {
                    console.log(numbers[i]);
                }
            }
        </script>
    </body>
</html>
