!DOCTYPE <html>
<html lang="en">
    <head>
        <title>Calculating Array Sum </title>
        <h1>Calculating Array Sum</h1>
        <h2>Add all values of the marks array and print the final sum</h2>
    </head>
    <body>
        <script>
            let marks =[80, 90, 75, 85, 95];
            let sum = 0;
            for(let i = 0; i < marks.length; i++){
                sum = sum + marks[i];
            }
            console.log("sum =", sum);
        </script>
    </body>
</html>
