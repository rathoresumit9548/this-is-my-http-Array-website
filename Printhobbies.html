!DOCTYPE <html>
<html lang="en">
    <head>
        <title>Adding items</title>
    </head>
    <h1>Adding items</h1>
    <h2>create an array named hobbies with 2 hobbies.  ADD 2 NEW HOOBBIES USING PUSH()</h2>
    <body>
        <script>
            let hobbies = ["Reading" ,"Playing cricket"];
            hobbies.push("singing");
            hobbies.push("Dancing");

            console.log(hobbies);
        </script>
    </body>

</html>
