    <h1>Removimg items</h1>
    <h2>create an array named cars with 4 cars names. use pop() to remove the last car. print before and after</h2>

    <body>
<script>
    let cars = ["Bwm", "Audi", "Honda", "Toyota"];

    console.log("Before:", cars);

    cars.pop();

    console.log("After:", cars);
</script>
